<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route53 Clone | Ravish Raheja</title>
  <meta name="description" content="AWS Route 53-inspired with full CRUD and authentication.">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <!-- Canvas Background for particles -->
  <canvas id="particleCanvas"></canvas>

  <!-- Sticky Navigation -->
  <nav class="sticky-nav">
    <div class="nav-links" style="justify-content: space-between; width: 100%; align-items: center;">
      <a href="index.html" class="nav-link" style="display: flex; align-items: center; gap: 0.5rem; font-weight: 600; color: var(--text-dark);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </a>
      <div style="display: flex; gap: 2rem;">
        <a href="https://route53-clone-5.vercel.app/" target="_blank" class="nav-link" style="color: #ff5f56; font-weight: 600;">Live Project ↗</a>
      </div>
    </div>
  </nav>

  <main>
    <style>
      .demo-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem 4rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* iPad Pro Mockup */
      .ipad-wrapper {
        width: 100%;
        max-width: 1150px;
        margin: 1rem auto 4rem auto;
        animation: fadeUp 1s ease-out forwards;
      }

      .ipad-frame {
        position: relative;
        width: 100%;
        padding-bottom: 72%; /* Taller aspect ratio for more screen area */
        background: #111; /* Uniform black bezel */
        border-radius: 36px;
        box-shadow: 
          inset 0 0 0 2px #444, /* Metallic edge */
          inset 0 0 0 3px #111,
          0 20px 50px rgba(0,0,0,0.3);
      }

      /* iPad Camera Hole (Top Center Landscape) */
      .ipad-frame::before {
        content: '';
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 8px;
        height: 8px;
        background: #1a1a1a;
        border-radius: 50%;
        border: 1px solid #333;
        z-index: 5;
      }

      .ipad-screen {
        position: absolute;
        top: 28px;
        left: 28px;
        right: 28px;
        bottom: 28px;
        background: #fff;
        border-radius: 8px; /* Slight inner rounding */
        overflow: hidden;
      }

      /* Safari Window Chrome */
      .safari-window {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: #fff;
      }

      .safari-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1rem;
        background: #f5f5f7;
        border-bottom: 1px solid #e5e5e5;
        height: 44px;
        box-sizing: border-box;
      }

      .safari-buttons {
        flex: 1;
        display: flex;
        gap: 8px;
      }

      .safari-buttons span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .safari-buttons .close-btn { background: #ff5f56; }
      .safari-buttons .min-btn { background: #ffbd2e; }
      .safari-buttons .max-btn { background: #27c93f; }

      .safari-url {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: #e3e3e5;
        border-radius: 6px;
        padding: 0.25rem 2rem;
        font-size: 0.85rem;
        color: #333;
        flex: 2;
        max-width: 400px;
        text-align: center;
      }

      .safari-url svg {
        color: #666;
      }

      .safari-actions {
        flex: 1;
        display: flex;
        justify-content: flex-end;
      }

      .cred-toggle {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: #fff;
        border: 1px solid #d1d1d6;
        padding: 0.25rem 0.6rem;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        color: #333;
        transition: background 0.2s;
        white-space: nowrap;
      }

      .cred-toggle:hover {
        background: #f0f0f0;
      }

      .safari-body {
        flex: 1;
        position: relative;
        background: #fff;
      }

      .safari-body iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      .cred-modal {
        position: absolute;
        top: 12px;
        right: 12px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(0,0,0,0.1);
        border-radius: 12px;
        padding: 1.25rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        transform: translateY(-10px) scale(0.95);
        opacity: 0;
        pointer-events: none;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 20;
        min-width: 220px;
      }

      .cred-modal.active {
        transform: translateY(0) scale(1);
        opacity: 1;
        pointer-events: auto;
      }

      .cred-modal h4 {
        margin: 0 0 1rem 0;
        font-size: 0.9rem;
        color: #333;
        border-bottom: 1px solid #eee;
        padding-bottom: 0.5rem;
      }

      .overlay-creds {
        background: #f9f9f9;
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 0.85rem;
        font-family: monospace;
        font-size: 0.95rem;
      }

      .overlay-creds div {
        margin: 0.5rem 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .overlay-creds div:first-child {
        margin-top: 0;
      }
      .overlay-creds div:last-child {
        margin-bottom: 0;
      }
      
      .overlay-creds div span {
        color: #666;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-right: 1rem;
      }
      
      .overlay-creds div strong {
        color: #111;
        font-weight: 600;
      }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(40px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 768px) {
        .ipad-frame {
          border-radius: 20px;
        }
        .ipad-screen {
          top: 14px; left: 14px; right: 14px; bottom: 14px;
        }
        .safari-url {
          display: none;
        }
      }
    </style>

    <!-- HERO SECTION -->
    <section class="cp-hero container animate-up" style="text-align: center; margin-top: 3.5rem; margin-bottom: 2rem;">
      <h1 class="huge-title typewriter" style="font-size: clamp(2.2rem, 6.5vw, 5.5rem); margin-bottom: 0.5rem; white-space: nowrap;">Route53 Clone<span class="gradient-cursor active"></span></h1>
      <p class="subtitle" style="font-size: clamp(1.055rem, 2vw, 1.525rem); font-weight: 500; color: var(--text-dark); max-width: 800px; margin: 0 auto;">A fully functional DNS management platform inspired by AWS Route 53, featuring complete CRUD operations and secure authentication.</p>
    </section>

    <!-- Content Layout -->
    <div class="demo-container">
      
      <!-- iPad Mockup with Live Iframe & Overlay -->
      <div class="ipad-wrapper">
        <div class="ipad-frame">
          <div class="ipad-screen">
            
            <!-- Safari Window -->
            <div class="safari-window">
              <div class="safari-header">
                <div class="safari-buttons">
                  <span class="close-btn"></span>
                  <span class="min-btn"></span>
                  <span class="max-btn"></span>
                </div>
                <div class="safari-url">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10A10 10 0 0 1 2 12 10 10 0 0 1 12 2z"></path></svg>
                  route53-clone.vercel.app
                </div>
                <div class="safari-actions">
                  <button class="cred-toggle" onclick="document.getElementById('credModal').classList.toggle('active')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
                    Credentials
                  </button>
                </div>
              </div>
              
              <div class="safari-body">
                <!-- Live Project Iframe -->
                <iframe src="https://route53-clone-5.vercel.app/" title="Route53 Clone Live Preview"></iframe>
                
                <!-- Credentials Modal inside browser -->
                <div class="cred-modal" id="credModal">
                  <h4>Demo Credentials</h4>
                  <div class="overlay-creds">
                    <div><span>Username</span> <strong>admin</strong></div>
                    <div><span>Password</span> <strong>admin123</strong></div>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
