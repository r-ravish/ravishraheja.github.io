<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route53 Clone | Ravish Raheja</title>
  <meta name="description" content="AWS Route 53-inspired with full CRUD and authentication.">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <!-- Canvas Background for particles -->
  <canvas id="particleCanvas"></canvas>

  <!-- Sticky Navigation -->
  <nav class="sticky-nav">
    <div class="nav-links" style="justify-content: space-between; width: 100%; align-items: center;">
      <a href="index.html" class="nav-link" style="display: flex; align-items: center; gap: 0.5rem; font-weight: 600; color: var(--text-dark);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
      </a>
      <div style="display: flex; gap: 2rem;">
        <a href="https://route53-clone-5.vercel.app/" target="_blank" class="nav-link" style="color: #ff5f56; font-weight: 600;">Live Project ↗</a>
      </div>
    </div>
  </nav>

  <main>
    <style>
      .demo-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem 4rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .auth-portal {
        width: 100%;
        max-width: 600px;
        background: #ffffff;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        text-align: center;
        margin-bottom: 4rem;
        animation: fadeUp 0.8s ease-out forwards;
      }

      .auth-header h3 {
        font-size: 1.35rem;
        margin-bottom: 0.5rem;
        color: var(--text-dark);
      }

      .auth-header p {
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 1.5rem;
      }

      .auth-creds {
        display: flex;
        gap: 1rem;
        justify-content: center;
      }

      .auth-cred-item {
        flex: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.85rem 1.25rem;
        background: var(--bg-light);
        border-radius: 8px;
        border: 1px solid rgba(0,0,0,0.05);
        transition: all 0.2s;
      }

      .auth-cred-item:hover {
        border-color: rgba(0,0,0,0.15);
        background: #ffffff;
      }

      .cred-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 600;
        letter-spacing: 0.05em;
      }

      .cred-value {
        font-family: monospace;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text-dark);
      }

      /* MacBook Mockup */
      .macbook-wrapper {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        perspective: 1500px;
        animation: fadeUp 1s ease-out 0.2s forwards;
        opacity: 0;
      }

      .macbook-frame {
        position: relative;
        width: 100%;
        background: #151515;
        border-radius: 24px 24px 0 0;
        padding: 2rem 2rem 2.5rem 2rem;
        box-shadow: inset 0 2px 4px rgba(255,255,255,0.15), 0 20px 50px rgba(0,0,0,0.3);
      }

      /* Webcam notch */
      .macbook-frame::before {
        content: '';
        position: absolute;
        top: 0.75rem;
        left: 50%;
        transform: translateX(-50%);
        width: 10px;
        height: 10px;
        background: #000;
        border-radius: 50%;
        box-shadow: inset 0 0 2px rgba(255,255,255,0.2);
      }

      .macbook-screen {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 10;
        background: #fff;
        border-radius: 6px;
        overflow: hidden;
      }

      .macbook-screen iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .macbook-base {
        position: relative;
        width: 114%;
        height: 24px;
        background: linear-gradient(180deg, #e5e5e5 0%, #c4c4c4 100%);
        left: -7%;
        border-radius: 0 0 12px 12px;
        box-shadow: inset 0 -4px 10px rgba(0,0,0,0.15), 0 30px 40px rgba(0,0,0,0.15);
        display: flex;
        justify-content: center;
      }

      .macbook-base::before {
        content: '';
        position: absolute;
        top: 0;
        width: 18%;
        height: 8px;
        background: #a3a3a3;
        border-radius: 0 0 8px 8px;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
      }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(40px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 768px) {
        .auth-creds {
          flex-direction: column;
        }
        .macbook-frame {
          padding: 1rem 1rem 1.5rem 1rem;
          border-radius: 12px 12px 0 0;
        }
        .macbook-base {
          height: 16px;
        }
      }
    </style>

    <!-- HERO SECTION -->
    <section class="cp-hero container animate-up" style="text-align: center; margin-top: 3.5rem; margin-bottom: 2rem;">
      <h1 class="huge-title typewriter" style="font-size: clamp(2.2rem, 6.5vw, 5.5rem); margin-bottom: 0.5rem; white-space: nowrap;">Route53 Clone<span class="gradient-cursor active"></span></h1>
      <p class="subtitle" style="font-size: clamp(1.055rem, 2vw, 1.525rem); font-weight: 500; color: var(--text-dark); max-width: 800px; margin: 0 auto;">A fully functional DNS management platform inspired by AWS Route 53, featuring complete CRUD operations and secure authentication.</p>
    </section>

    <!-- Content Layout -->
    <div class="demo-container">
      
      <!-- Credentials Block -->
      <div class="auth-portal">
        <div class="auth-header">
          <h3>Demo Access</h3>
          <p>Use these test credentials to securely authenticate into the live project below.</p>
        </div>
        
        <div class="auth-creds">
          <div class="auth-cred-item">
            <span class="cred-label">Username</span>
            <span class="cred-value">admin</span>
          </div>
          <div class="auth-cred-item">
            <span class="cred-label">Password</span>
            <span class="cred-value">admin123</span>
          </div>
        </div>
      </div>

      <!-- MacBook Mockup with Live Iframe -->
      <div class="macbook-wrapper">
        <div class="macbook-frame">
          <div class="macbook-screen">
            <iframe src="https://route53-clone-5.vercel.app/" title="Route53 Clone Live Preview"></iframe>
          </div>
        </div>
        <div class="macbook-base"></div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
