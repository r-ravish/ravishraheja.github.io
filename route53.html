</head>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

  <main>
    <style>
      .demo-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem 4rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* 3D Interactive Scene */
      .scene {
        width: 100%;
        max-width: 1200px; /* Increased from 1024px */
        margin: 2rem auto 4rem auto;
        perspective: 2500px;
        cursor: grab;
        animation: fadeUp 1s ease-out forwards;
        position: relative;
      }
      .scene:active {
        cursor: grabbing;
      }

      .drag-hint {
        position: absolute;
        top: -40px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.8);
        color: #fff;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        pointer-events: none;
        animation: pulseHint 2s infinite;
        z-index: 50;
      }

      @keyframes pulseHint {
        0%, 100% { opacity: 0.8; transform: translate(-50%, 0); }
        50% { opacity: 1; transform: translate(-50%, -5px); }
      }

      .ipad-3d {
        position: relative;
        width: 100%;
        aspect-ratio: 1.43; /* Fixes height collapse perfectly */
        transform-style: preserve-3d;
        /* Start straight */
        transform: rotateX(0deg) rotateY(0deg);
        transition: transform 0.05s linear;
      }

      .ipad-face {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100%;
        height: 100%;
        border-radius: 36px;
        backface-visibility: hidden;
      }

      /* Front Face */
      .ipad-front {
        background: #111;
        box-shadow: inset 0 0 0 2px #444, inset 0 0 0 3px #111;
        transform: translateZ(4px); /* Extrude front */
      }

      /* Camera Hole Front */
      .ipad-front::before {
        content: '';
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 8px;
        height: 8px;
        background: #1a1a1a;
        border-radius: 50%;
        border: 1px solid #333;
        z-index: 5;
      }

      /* Back Face */
      .ipad-back {
        background: linear-gradient(135deg, #e8e8ed 0%, #d1d1d6 40%, #e8e8ed 100%); /* Realistic aluminum finish */
        transform: rotateY(180deg) translateZ(4px); /* Extrude back */
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08), inset 0 0 40px rgba(0,0,0,0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      /* Edge Layer to hide gaps */
      .ipad-edge {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 36px;
        background: #b0b0b5;
        transform: translateZ(0);
        box-shadow: 0 0 0 3px #a0a0a5;
        backface-visibility: hidden;
      }

      /* Apple Logo SVG styling */
      .apple-logo-svg {
        width: 90px;
        height: 90px;
        fill: url(#metallicGradient);
        /* Shiny metallic reflection */
        filter: drop-shadow(0 1px 1px rgba(255,255,255,0.8)) drop-shadow(0 -1px 1px rgba(0,0,0,0.1));
      }

      /* Realistic Back Camera Module */
      .camera-module {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 85px;
        height: 85px;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 22px;
        box-shadow: 
          4px 4px 10px rgba(0,0,0,0.15),
          inset 1px 1px 2px rgba(255,255,255,0.7),
          inset -1px -1px 2px rgba(0,0,0,0.05);
        border: 1px solid rgba(255,255,255,0.2);
      }

      .lens-container {
        position: absolute;
        width: 32px;
        height: 32px;
        background: #111;
        border-radius: 50%;
        border: 2px solid #555;
        box-shadow: inset 0 0 10px #000, 0 1px 2px rgba(255,255,255,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Inner lens reflection */
      .lens-container::after {
        content: '';
        width: 12px;
        height: 12px;
        background: radial-gradient(circle at 35% 35%, #4a4a7a 0%, #111 60%);
        border-radius: 50%;
      }

      .lens-1 { top: 8px; left: 8px; }
      .lens-2 { bottom: 8px; left: 8px; }

      .lidar {
        position: absolute;
        top: 32px;
        right: 12px;
        width: 20px;
        height: 20px;
        background: #151515;
        border-radius: 50%;
        box-shadow: inset 0 0 5px #000;
      }

      .flash {
        position: absolute;
        top: 14px;
        right: 16px;
        width: 12px;
        height: 12px;
        background: #fff;
        border-radius: 50%;
        box-shadow: inset 0 0 3px #ffe5b4, 0 0 3px rgba(255,255,255,0.8);
      }
      
      .mic {
        position: absolute;
        bottom: 24px;
        right: 20px;
        width: 5px;
        height: 5px;
        background: #333;
        border-radius: 50%;
        box-shadow: inset 0 1px 1px #000;
      }

      /* Smart Connector Pins */
      .smart-connector {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }

      .smart-pin {
        width: 8px;
        height: 8px;
        background: #b0b0b5;
        border-radius: 50%;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.7);
      }

      .ipad-screen {
        position: absolute;
        top: 28px;
        left: 28px;
        right: 28px;
        bottom: 28px;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
      }

      /* Safari Window Chrome */
      .safari-window {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background: #fff;
      }

      .safari-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1rem;
        background: #f5f5f7;
        border-bottom: 1px solid #e5e5e5;
        height: 44px;
        box-sizing: border-box;
      }

      .safari-buttons {
        flex: 1;
        display: flex;
        gap: 8px;
      }

      .safari-buttons span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .safari-buttons .close-btn { background: #ff5f56; }
      .safari-buttons .min-btn { background: #ffbd2e; }
      .safari-buttons .max-btn { background: #27c93f; }

      .safari-url {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: #e3e3e5;
        border-radius: 6px;
        padding: 0.25rem 2rem;
        font-size: 0.85rem;
        color: #333;
        flex: 2;
        max-width: 400px;
        text-align: center;
      }

      .safari-url svg {
        color: #666;
      }

      .safari-actions {
        flex: 1;
        display: flex;
        justify-content: flex-end;
      }

      .cred-toggle {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: #fff;
        border: 1px solid #d1d1d6;
        padding: 0.25rem 0.6rem;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        color: #333;
        transition: background 0.2s;
        white-space: nowrap;
      }

      .cred-toggle:hover {
        background: #f0f0f0;
      }

      .safari-body {
        flex: 1;
        position: relative;
        background: #fff;
      }

      .safari-body iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      .cred-modal {
        position: absolute;
        top: 12px;
        right: 12px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(0,0,0,0.1);
        border-radius: 12px;
        padding: 1.25rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        transform: translateY(-10px) scale(0.95);
        opacity: 0;
        pointer-events: none;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 20;
        min-width: 220px;
      }

      .cred-modal.active {
        transform: translateY(0) scale(1);
        opacity: 1;
        pointer-events: auto;
      }

      .cred-modal h4 {
        margin: 0 0 1rem 0;
        font-size: 0.9rem;
        color: #333;
        border-bottom: 1px solid #eee;
        padding-bottom: 0.5rem;
      }

      .overlay-creds {
        background: #f9f9f9;
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 0.85rem;
        font-family: monospace;
        font-size: 0.95rem;
      }

      .overlay-creds div {
        margin: 0.5rem 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .overlay-creds div:first-child {
        margin-top: 0;
      }
      .overlay-creds div:last-child {
        margin-bottom: 0;
      }
      
      .overlay-creds div span {
        color: #666;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-right: 1rem;
      }
      
      .overlay-creds div strong {
        color: #111;
        font-weight: 600;
      }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(40px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 768px) {
        .ipad-frame {
          border-radius: 20px;
        }
        .ipad-screen {
          top: 14px; left: 14px; right: 14px; bottom: 14px;
        }
        .safari-url {
          display: none;
        }
      }
    </style>

    <!-- HERO SECTION -->

      <h1 class="huge-title typewriter" style="font-size: clamp(2.2rem, 6.5vw, 5.5rem); margin-bottom: 0.5rem; white-space: nowrap;">Route53 Clone<span class="gradient-cursor active"></span></h1>
      <p class="subtitle" style="font-size: clamp(1.055rem, 2vw, 1.525rem); font-weight: 500; color: var(--text-dark); max-width: 800px; margin: 0 auto;">A fully functional DNS management platform inspired by AWS Route 53, featuring complete CRUD operations and secure authentication.</p>
    </section>

    <!-- Content Layout -->

                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10A10 10 0 0 1 2 12 10 10 0 0 1 12 2z"></path></svg>
                    route53-clone.vercel.app

                  <div class="safari-actions">

                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
                      Credentials
                    </button>

                </div>
                
                <div class="safari-body">
                  <iframe src="https://route53-clone-5.vercel.app/" title="Route53 Clone Live Preview"></iframe>
                  
                  <div class="cred-modal" id="credModal">
                    <h4>Demo Credentials</h4>
                    <div class="overlay-creds">
                      <div><span>Username</span> <strong>admin</strong></div>
                      <div><span>Password</span> <strong>admin123</strong></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Back Face -->
          <div class="ipad-face ipad-back">
            <!-- Apple Logo -->
            <svg class="apple-logo-svg" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="metallicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#a0a0a5"/>

                </linearGradient>
              </defs>
              <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
            </svg>
            
            <!-- Camera Bump -->
            <div class="camera-module">
              <div class="lens-container lens-1"></div>
              <div class="lens-container lens-2"></div>
              <div class="lidar"></div>
              <div class="flash"></div>

            <!-- Smart Connector -->

              <div class="smart-pin"></div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
  <script>
    // 3D iPad Rotation Logic
    const scene = document.getElementById('sceneContainer');
    const model = document.getElementById('ipadModel');
    
    let isDragging = false;
    let startX, startY;
    // Start straight initially
    let currentRotX = 0;
    let currentRotY = 0;

    // Pointer events for mouse and touch
    scene.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      scene.style.cursor = 'grabbing';
      
      // Hide the drag hint on first interaction
      const hint = document.querySelector('.drag-hint');
      if(hint) hint.style.display = 'none';
      
      // Disable iframe pointer events while dragging so it doesn't swallow events
      document.querySelector('.safari-body iframe').style.pointerEvents = 'none';
    });

    window.addEventListener('pointermove', (e) => {
      if(!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      
      // Adjust rotation speed
      currentRotY += dx * 0.4;
      currentRotX -= dy * 0.4;
      
      // Clamp X rotation to prevent flipping upside down over the top/bottom
      currentRotX = Math.max(-60, Math.min(60, currentRotX));
      
      model.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
      scene.style.cursor = 'grab';
      document.querySelector('.safari-body iframe').style.pointerEvents = 'auto';
    });
  </script>
